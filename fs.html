<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlowerShop · Астанада гүл жеткізу</title>
<meta name="description" content="FlowerShop — Астанада гүл жеткізу 90 минутта. Букет конструкторы, Kaspi QR, жібермес бұрын фото.">
<meta property="og:title" content="FlowerShop — доставка цветов в Астане"><meta property="og:image" content="https://images.unsplash.com/photo-1780498802979-3d75e2b87ff2?w=1200&q=80&auto=format&fit=crop">
<meta name="theme-color" content="#9E2A3A">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%239E2A3A'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white'>✿</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#FAF6F1;--card:#fff;--ink:#221D1A;--mut:#7A706A;--line:#EAE2D9;--acc:#9E2A3A;--acc2:#C2414F;--blush:#F6E4E0;--sage:#6E8B74;--sage2:#E6EEE7;--gold:#C8A26B;--r:18px;--sh:0 10px 30px rgba(60,30,20,.08);--sh2:0 20px 60px rgba(60,30,20,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;transition:.2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.btn.acc{background:var(--acc)}.btn.acc:hover{background:var(--acc2)}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.light{background:#fff;color:var(--ink)}
.btn.sm{height:38px;padding:0 16px;font-size:14px}
.btn.wa{background:#25D366}
.btn:disabled{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;transition:.15s;white-space:nowrap}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.tag.hit{background:var(--acc);color:#fff}.tag.new{background:var(--sage);color:#fff}.tag.sale{background:var(--gold);color:#fff}
/* topbar */
.top{background:var(--ink);color:#EDE6DF;font-size:13px}
.top .wrap{display:flex;justify-content:space-between;align-items:center;height:36px;gap:16px}
.top .tick{display:flex;gap:28px;overflow:hidden;white-space:nowrap}
.top .rt{display:flex;gap:18px;align-items:center}
.lang{display:flex;border:1px solid #5a514b;border-radius:999px;overflow:hidden}
.lang button{padding:2px 10px;font-size:12px;font-weight:600;color:#bdb3aa}
.lang button.on{background:#EDE6DF;color:var(--ink)}
/* header */
header.h{position:sticky;top:0;z-index:50;background:rgba(250,246,241,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.h .wrap{display:flex;align-items:center;gap:24px;height:76px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;letter-spacing:-.01em}
.logo i{width:38px;height:38px;border-radius:50%;background:var(--acc);display:grid;place-items:center;color:#fff;font-style:normal;font-size:20px}
.logo small{display:block;font-family:Inter;font-size:10px;letter-spacing:.2em;color:var(--mut);text-transform:uppercase;margin-top:-6px}
nav.mn{display:flex;gap:20px;font-weight:500;font-size:14px;white-space:nowrap}
nav.mn a{position:relative;padding:6px 0}
nav.mn a:after{content:'';position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--acc);transition:.2s}
nav.mn a:hover:after,nav.mn a.on:after{width:100%}
.srch{flex:1;max-width:300px;min-width:160px;position:relative;margin-left:auto}
.srch input{width:100%;height:44px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 18px 0 42px;outline:0}
.srch input:focus{border-color:var(--ink)}
.srch svg{position:absolute;left:15px;top:13px}
.srch .sug{position:absolute;top:50px;left:0;right:0;background:#fff;border-radius:16px;box-shadow:var(--sh2);overflow:hidden;display:none;z-index:5}
.srch .sug a{display:flex;gap:12px;align-items:center;padding:10px 14px;font-size:14px}
.srch .sug a:hover{background:var(--bg)}
.srch .sug img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.icons{display:flex;gap:6px}
.ib{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:.15s}
.ib:hover{background:#fff}
.ib b{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;display:grid;place-items:center}
.who{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 6px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:600}
.who .av{width:32px;height:32px;border-radius:50%;background:var(--blush);display:grid;place-items:center;color:var(--acc);font-weight:700}
.burger{display:none}
/* hero */
.hero{padding:40px 0 30px}
.hero>.wrap:first-child{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:76px;line-height:.98;font-weight:500;letter-spacing:-.02em}
.hero h1 em{color:var(--acc);font-style:italic}
.hero p.lead{font-size:18px;color:var(--mut);margin:22px 0 30px;max-width:520px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .stats{display:flex;gap:36px;margin-top:40px}
.hero .stats b{display:block;font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:600;line-height:1}
.hero .stats span{font-size:13px;color:var(--mut)}
.collage{position:relative;height:580px}
.collage img{position:absolute;object-fit:cover;border-radius:28px;box-shadow:var(--sh2)}
.collage .a{left:0;top:0;width:62%;height:78%}
.collage .b{right:0;top:9%;width:42%;height:46%}
.collage .c{right:5%;bottom:0;width:48%;height:40%}
.float{position:absolute;background:#fff;border-radius:18px;box-shadow:var(--sh2);padding:14px 16px;display:flex;gap:12px;align-items:center;font-size:13px;animation:fl 5s ease-in-out infinite}
.float b{display:block;font-size:14px}
.float .dot{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.f1{left:-24px;bottom:12%}.f2{right:-10px;top:-14px;animation-delay:-2.5s}
@keyframes fl{50%{transform:translateY(-8px)}}
/* usp */
.usp{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:30px 0 10px}
.usp div{background:#fff;border-radius:var(--r);padding:20px;display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line)}
.usp i{font-style:normal;width:44px;height:44px;border-radius:14px;background:var(--blush);display:grid;place-items:center;font-size:20px;flex:none}
.usp b{display:block;font-size:14.5px}.usp span{font-size:13px;color:var(--mut)}
section.s{padding:56px 0}
.sh{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;gap:20px}
.sh h2{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:500;line-height:1;letter-spacing:-.01em}
.sh p{color:var(--mut);margin-top:8px}
.sh a.more{font-weight:600;border-bottom:1.5px solid;padding-bottom:2px}
/* categories */
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.cat{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/5;background:#ddd}
.cat img{width:100%;height:100%;object-fit:cover;transition:.6s}
.cat:hover img{transform:scale(1.06)}
.cat span{position:absolute;inset:auto 0 0 0;padding:40px 16px 16px;background:linear-gradient(transparent,rgba(20,10,8,.7));color:#fff;font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600}
.occs{display:flex;gap:10px;flex-wrap:wrap}
/* product grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.pc{background:#fff;border-radius:22px;overflow:hidden;border:1px solid var(--line);transition:.25s;display:flex;flex-direction:column;position:relative}
.pc:hover{box-shadow:var(--sh2);transform:translateY(-3px)}
.pc .im{position:relative;aspect-ratio:1/1.08;overflow:hidden;background:#eee;cursor:pointer}
.pc .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s,transform .7s}
.pc .im img+img{opacity:0}
.pc:hover .im img+img{opacity:1}
.pc:hover .im img{transform:scale(1.04)}
.pc .tags{position:absolute;top:12px;left:12px;display:flex;gap:6px;z-index:2}
.pc .fav{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;z-index:2;transition:.15s}
.pc .fav.on svg{fill:var(--acc);stroke:var(--acc)}
.pc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc .nm{font-weight:600;font-size:15px;line-height:1.3;cursor:pointer}
.pc .rt{font-size:12.5px;color:var(--mut)}
.pc .rt b{color:#E0A100}
.pc .pr{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:6px}
.pc .pr b{font-size:19px}.pc .pr s{color:var(--mut);font-size:13px}
.pc .ac{display:flex;gap:8px;margin-top:8px}
.pc .ac .btn{flex:1;height:42px;font-size:14px}
.pc .ac .wa2{width:42px;height:42px;border-radius:50%;background:#E7F8EE;display:grid;place-items:center;flex:none}
.pc .eta{font-size:12px;color:var(--sage);font-weight:600}
/* catalog */
.cat-l{display:grid;grid-template-columns:260px 1fr;gap:30px;align-items:start}
.filters{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;position:sticky;top:96px}
.filters h4{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:18px 0 10px}
.filters h4:first-child{margin-top:0}
.filters label{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px;cursor:pointer}
.filters input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.range{display:flex;gap:8px}
.range input{width:100%;height:40px;border:1px solid var(--line);border-radius:12px;padding:0 10px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
select.sel{height:42px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 16px}
.empty{padding:60px;text-align:center;color:var(--mut);background:#fff;border-radius:22px;border:1px dashed var(--line)}
/* product page */
.pp{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;padding:30px 0 60px}
.gal{display:grid;grid-template-columns:84px 1fr;gap:14px}
.gal .th{display:flex;flex-direction:column;gap:10px}
.gal .th img{width:84px;height:96px;object-fit:cover;border-radius:14px;cursor:pointer;opacity:.6;border:2px solid transparent}
.gal .th img.on{opacity:1;border-color:var(--ink)}
.gal .main{border-radius:26px;overflow:hidden;aspect-ratio:1/1.1;background:#eee}
.gal .main img{width:100%;height:100%;object-fit:cover}
.crumbs{font-size:13px;color:var(--mut);padding-top:24px}
.crumbs a:hover{color:var(--ink)}
.pi h1{font-family:'Cormorant Garamond',serif;font-size:46px;font-weight:500;line-height:1.05;margin:10px 0}
.pi .price{display:flex;align-items:baseline;gap:12px;margin:16px 0}
.pi .price b{font-size:32px}.pi .price s{color:var(--mut)}
.opt{margin:20px 0}
.opt h5{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg button{min-width:90px;padding:10px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;text-align:left;font-size:14px}
.seg button small{display:block;color:var(--mut);font-size:12px}
.seg button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.addons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.addon{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;cursor:pointer;font-size:12px;position:relative}
.addon img{width:100%;aspect-ratio:1;object-fit:cover}
.addon div{padding:6px 8px}
.addon.on{border-color:var(--acc)}
.addon.on:after{content:'✓';position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:12px}
.recipe{background:var(--sage2);border-radius:16px;padding:16px 18px;font-size:14px}
.recipe li{list-style:none;display:flex;justify-content:space-between;padding:3px 0}
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;height:48px;background:#fff}
.qty button{width:44px;height:44px;font-size:20px}
.qty span{min-width:28px;text-align:center;font-weight:600}
.buy{display:flex;gap:12px;margin-top:22px}
.buy .btn{flex:1;height:54px}
.guar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.guar div{display:flex;gap:10px;font-size:13px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
textarea.card{width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:14px;padding:12px;resize:vertical;background:#fff;outline:0}
/* constructor */
.kon{display:grid;grid-template-columns:1fr 420px;gap:30px;align-items:start}
.flw{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fl{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.fl img{width:100%;aspect-ratio:1.2;object-fit:cover}
.fl .b{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fl .b b{font-size:14px}.fl .b small{display:block;color:var(--mut);font-size:12px}
.fl .qty{height:36px}.fl .qty button{width:32px;height:32px;font-size:16px}
.fl.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.prev{position:sticky;top:96px;background:#fff;border-radius:26px;border:1px solid var(--line);padding:22px;box-shadow:var(--sh)}
.stage{height:300px;border-radius:20px;background:radial-gradient(circle at 50% 40%,#fff,#F3EBE3);position:relative;overflow:hidden;margin-bottom:16px}
.stage .wrapper{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);width:0;height:0;border-left:110px solid transparent;border-right:110px solid transparent;border-top:180px solid var(--wc,#C9A27A);transition:.3s}
.stage .bud{position:absolute;width:44px;height:44px;border-radius:50%;background-size:230%;background-position:center;box-shadow:0 4px 12px rgba(60,20,20,.25),inset 0 0 0 2px rgba(255,255,255,.6);transition:.3s;animation:pop .35s}
@keyframes pop{from{transform:scale(0)}}
.stage .hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:14px;text-align:center;padding:30px}
.lines{font-size:14px;max-height:180px;overflow:auto;margin:10px 0}
.lines div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;padding-top:10px}
.tot b{font-size:26px}
/* drawer & modal */
.ov{position:fixed;inset:0;background:rgba(25,15,12,.45);backdrop-filter:blur(3px);z-index:90;opacity:0;pointer-events:none;transition:.25s}
.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--bg);z-index:100;transform:translateX(105%);transition:.35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .hd{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}
.drawer .hd h3{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600}
.drawer .ls{flex:1;overflow:auto;padding:12px 24px}
.ci{display:grid;grid-template-columns:76px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.ci img{width:76px;height:84px;border-radius:14px;object-fit:cover}
.ci .n{font-weight:600;font-size:14px;line-height:1.3}
.ci small{color:var(--mut);font-size:12px;display:block}
.ci .qty{height:34px;margin-top:6px;width:max-content}.ci .qty button{width:30px;height:30px;font-size:15px}
.drawer .ft{padding:20px 24px;border-top:1px solid var(--line);background:#fff}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--sage);transition:.4s}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;z-index:110;background:var(--bg);border-radius:28px;width:min(460px,94vw);max-height:92vh;overflow:auto;transition:.25s;box-shadow:var(--sh2)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal .in{padding:30px}
.modal h3{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;line-height:1.1}
.x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);font-size:18px}
.fld{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.fld label{font-size:13px;font-weight:600}
.fld input,.fld select,.fld textarea{height:48px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 14px;outline:0;transition:.15s}
.fld textarea{height:auto;min-height:80px;padding:12px 14px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--ink)}
.fld.err input{border-color:var(--acc)}
.demo{margin-top:18px;background:#fff;border:1px dashed var(--gold);border-radius:16px;padding:14px;font-size:13px}
.demo button{display:flex;width:100%;justify-content:space-between;padding:7px 8px;border-radius:10px;text-align:left}
.demo button:hover{background:var(--bg)}
.demo code{font-family:ui-monospace,monospace;font-size:12px;color:var(--acc)}
.err-m{color:var(--acc);font-size:13px;margin-top:8px;min-height:18px}
/* checkout */
.co{display:grid;grid-template-columns:1fr 400px;gap:30px;align-items:start;padding:20px 0 70px}
.steps{display:flex;gap:8px;margin:10px 0 24px}
.steps div{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps div.on{background:var(--acc)}
.box{background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;margin-bottom:18px}
.box h3{font-size:19px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.box h3 i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.radio{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.radio button{border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:left;background:#fff;font-size:14px}
.radio button small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.radio button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.slots button{padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:13.5px}
.slots button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.slots button:disabled{opacity:.35;text-decoration:line-through}
.sum{position:sticky;top:96px}
.sum .row{display:flex;justify-content:space-between;padding:6px 0;font-size:14.5px}

 <div class="card"><table class="t"><tr><th>${L('Код','Код')}</th><th>${L('Жеңілдік','Скидка')}</th><th>${L('Қолданылды','Использован')}</th><th>${L('Белсенді','Активен')}</th></tr>${S.promos.map((p,i)=>`<tr><td><b>${p.code}</b></td><td>${p.pct} %</td><td>${p.used} ${L('рет','раз')}</td><td><input type="checkbox" ${p.active?'checked':''} style="accent-color:var(--acc);width:18px;height:18px" onchange="S.promos[${i}].active=this.checked;save()"></td></tr>`).join('')}</table></div>`}
function addPromo(){const c=$('#pr_c').value.trim().toUpperCase(),p=+$('#pr_p').value;if(!/^[A-Z0-9]{3,15}$/.test(c)||p<1||p>90)return toast('✖ '+L('Код: 3–15 латын әріп/сан, 1–90 %','Код: 3–15 лат. букв/цифр, 1–90 %'));if(S.promos.some(x=>x.code===c))return toast('✖ '+L('Мұндай код бар','Такой код уже есть'));S.promos.push({code:c,pct:p,active:true,used:0});save();render()}
function aUsers(){return `<h1>${L('Пайдаланушылар мен рөлдер','Пользователи и роли')}</h1><p class="sub">${L('Рөл бойынша қолжетімділік','Доступ по ролям')}</p>
 <div class="card"><table class="t"><tr><th>${L('Аты','Имя')}</th><th>${L('Логин','Логин')}</th><th>${L('Рөл','Роль')}</th><th>${L('Қолжетімділік','Доступ')}</th></tr>${USERS.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td><code>${u.login}</code></td><td>${L(...ROLE_NAME[u.role])}</td><td style="font-size:13px">${{admin:L('Барлық бөлім: тапсырыс, тауар, қойма, CRM, есеп, рөлдер','Все разделы: заказы, товары, склад, CRM, отчёты, роли'),client:L('Каталог, себет, тапсырыс, жеке кабинет, бонус','Каталог, корзина, заказы, кабинет, бонусы'),florist:L('Жинау кезегі, рецептура, фото, қойманы қарау','Очередь сборки, рецептура, фото, просмотр склада'),courier:L('Өз жеткізулері, маршрут, мәртебе','Свои доставки, маршрут, статус')}[u.role]}</td></tr>`).join('')}</table></div>
 <div class="card"><h3>${L('Қолжетімділік матрицасы','Матрица доступа')}</h3><table class="t"><tr><th>${L('Бөлім','Раздел')}</th><th>${L('Әкімші','Админ')}</th><th>${L('Флорист','Флорист')}</th><th>${L('Курьер','Курьер')}</th><th>${L('Клиент','Клиент')}</th></tr>${[[L('Тапсырыстар (барлығы)','Все заказы'),1,1,0,0],[L('Тауар және баға','Товары и цены'),1,0,0,0],[L('Қойма','Склад'),1,'👁',0,0],[L('Жеткізу мәртебесі','Статус доставки'),1,0,1,0],[L('CRM және есептер','CRM и отчёты'),1,0,0,0],[L('Өз тапсырыстары','Свои заказы'),1,0,0,1]].map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(x=>`<td>${x===1?'✅':x?x:'—'}</td>`).join('')}</tr>`).join('')}</table></div>`}
function aLog(){const all=[];S.orders.forEach(o=>o.log.forEach(l=>all.push({...l,id:o.id})));all.sort((a,b)=>b.t.localeCompare(a.t));
 return `<h1>${L('Мәртебелер журналы','Журнал статусов')}</h1><p class="sub">${L('Кім, қашан, нені өзгертті','Кто, когда и что изменил')}</p><div class="card log" style="max-height:none">${all.slice(0,80).map(l=>`<div><span>${l.t}</span><span><b>${l.id}</b> → ${ST[l.s]?stB(l.s):'<code>'+l.s+'</code>'} · ${esc(l.who)}</span></div>`).join('')}</div>`}
/* ----- florist ----- */
function fQueue(){const q=S.orders.filter(o=>['new','prep'].includes(o.status)).sort((a,b)=>(a.date+a.slot).localeCompare(b.date+b.slot));
 const ready=S.orders.filter(o=>o.status==='ready');
 return `<h1>${L('Жинау кезегі','Очередь сборки')}</h1><p class="sub">${L('Жеткізу уақыты бойынша сұрыпталған. Жинағаннан кейін фото жүктеңіз — ол клиентке WhatsApp арқылы кетеді.','Отсортировано по времени доставки. После сборки загрузите фото — оно уйдёт клиенту в WhatsApp.')}</p>
 ${q.length?q.map(o=>{const nd=needs(o);const short=Object.entries(nd).filter(([f,n])=>stockOf(f)<n);return `<div class="ocard"><img src="${U(oPh(o),240)}" alt=""><div><h4>${o.id} ${stB(o.status)}</h4><div class="meta">⏰ <b>${o.date} · ${o.slot}</b><br>💐 ${esc(itemsTxt(o))}${o.card?`<br>✉ «${esc(o.card)}»`:''}</div>
 <div>${Object.entries(nd).map(([f,n])=>`<span class="pill" style="${stockOf(f)<n?'background:#FDECEE;color:var(--acc)':''}">${N(fl(f))} × <b>${n}</b> <small>(${L('қойма','склад')}: ${stockOf(f)})</small></span>`).join('')}${o.items.some(c=>c.addons&&c.addons.length)?`<span class="pill">🎁 ${o.items.flatMap(c=>c.addons||[]).map(a=>N(prod(a))).join(', ')}</span>`:''}</div>${short.length?`<div class="warn r" style="margin-top:8px">⚠ ${L('Қойма жеткіліксіз: ','Не хватает на складе: ')}${short.map(([f])=>N(fl(f))).join(', ')}</div>`:''}</div>
 <div class="acts">${o.status==='new'?`<button class="btn acc sm" onclick="startPrep('${o.id}')">▶ ${L('Жинауды бастау','Начать сборку')}</button>`:`<button class="btn sm" onclick="finishPrep('${o.id}')" ${short.length?'disabled':''}>📸 ${L('Дайын + фото','Готово + фото')}</button>`}</div></div>`}).join(''):`<div class="empty">🎉 ${L('Кезек бос','Очередь пуста')}</div>`}
 ${ready.length?`<div class="card" style="margin-top:20px"><h3>📸 ${L('Дайын, курьерді күтуде','Готовы, ждут курьера')}</h3>${ordersTable(ready,false)}</div>`:''}`}
function startPrep(id){const o=S.orders.find(x=>x.id===id);o.florist=me().login;setStatus(id,'prep')}
function finishPrep(id){const o=S.orders.find(x=>x.id===id),nd=needs(o);
 Object.entries(nd).forEach(([f,n])=>{let need=n;S.stock.filter(b=>b.fl===f).sort((a,b)=>a.exp.localeCompare(b.exp)).forEach(b=>{const t=Math.min(b.qty,need);b.qty-=t;need-=t})});
 o.photo=o.items[0].custom?o.items[0].ph:prod(o.items[0].pid).ph[1]||prod(o.items[0].pid).ph[0];
 if(o.mode==='pickup')o.log.push({t:ts(),who:me().name,s:'ready'});setStatus(id,'ready')}
/* ----- courier ----- */
function cList(){const u=me();const list=S.orders.filter(o=>o.mode==='courier'&&(o.status==='way'&&o.courier===u.login||o.status==='ready'&&(!o.courier||o.courier===u.login)));
 return `<h1>${L('Менің жеткізулерім','Мои доставки')}</h1><p class="sub">${L('Букетті алып, жолға шыққанда және тапсырғанда мәртебені белгілеңіз','Отмечайте статус, когда забрали букет и когда вручили')}</p>
 <div class="kpi"><div><span>${L('Жолда','В пути')}</span><b>${list.filter(o=>o.status==='way').length}</b></div><div><span>${L('Алуға дайын','Готовы к выдаче')}</span><b>${list.filter(o=>o.status==='ready').length}</b></div><div><span>${L('Бүгін жеткізілді','Доставлено сегодня')}</span><b>${S.orders.filter(o=>o.courier===u.login&&o.status==='done'&&(o.delivered||'').includes(new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}))).length}</b></div><div><span>${L('Қолма-қол алу','Собрать наличными')}</span><b>${fmt(list.filter(o=>!o.paid).reduce((a,o)=>a+o.total,0))}</b></div></div>
 ${list.length?list.map(o=>`<div class="ocard"><img src="${U(PH[o.photo]||oPh(o),240)}" alt=""><div><h4>${o.id} ${stB(o.status)}</h4><div class="meta">⏰ <b>${o.date} · ${o.slot}</b><br>📍 ${esc(o.address)} · ${N(DISTRICTS[o.district])}<br>👤 ${esc(o.recipient.name)} · <a href="tel:${o.recipient.phone}" style="color:var(--acc)">${o.recipient.phone}</a>${o.recipient.anon?' · 🤫 '+L('аноним','анонимно'):''}<br>💳 ${o.paid?'✅ '+L('төленген','оплачено'):'💵 '+L('қолма-қол алу: ','взять наличными: ')+'<b>'+fmt(o.total)+'</b>'}</div></div>
 <div class="acts"><a class="btn sm ghost" target="_blank" href="https://2gis.kz/astana/search/${encodeURIComponent(o.address)}">🗺 ${L('Маршрут','Маршрут')}</a>${o.status==='ready'?`<button class="btn acc sm" onclick="takeO('${o.id}')">🚗 ${L('Алдым, жолдамын','Забрал, в пути')}</button>`:`<button class="btn sm" style="background:var(--sage)" onclick="setStatus('${o.id}','done')">✅ ${L('Тапсырдым','Вручил')}</button>`}</div></div>`).join(''):`<div class="empty">☕ ${L('Қазір жеткізу жоқ','Сейчас доставок нет')}</div>`}`}
function takeO(id){const o=S.orders.find(x=>x.id===id);o.courier=me().login;setStatus(id,'way')}
function cDone(){const u=me();const l=S.orders.filter(o=>o.courier===u.login&&o.status==='done');return `<h1>${L('Орындалғандар','Выполненные')}</h1><p class="sub">${l.length} ${L('жеткізу','доставок')}</p><div class="card">${ordersTable(l,false)}</div>`}
</script></body></html>
