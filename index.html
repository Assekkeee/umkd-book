<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Керек — онлайн дүкен: телефон аксессуарлары, шағын техника, үйге арналған заттар</title>
<meta name="description" content="Керек онлайн дүкені: Астана бойынша ертең жеткізу, Kaspi QR арқылы төлеу, 15 000 ₸-ден тегін жеткізу.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%231D4ED8'/%3E%3Cpath d='M12 16h16l-1.6 13.2a2 2 0 0 1-2 1.8h-8.8a2 2 0 0 1-2-1.8z' fill='%23fff'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;--p:#1D4ED8;--p2:#1E40AF;--pl:#EAF0FF;--a:#FF6B2C;--ink:#0F172A;--mut:#64748B;--line:#E5E9F0;--bg:#F6F8FB;--ok:#16A34A;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;outline:none;transition:border .15s}
input:focus,select:focus{border-color:var(--p)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.muted{color:var(--mut)}small.muted{display:block;font-size:12.5px}
.center{text-align:center;display:block}.w100{width:100%}.mt{margin-top:16px;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;transition:transform .1s,background .15s,box-shadow .15s;background:#EEF1F6;white-space:nowrap}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--p);color:#fff}.btn-primary:hover{background:var(--p2)}
.btn-accent{background:var(--a);color:#fff;box-shadow:0 6px 16px -6px rgba(255,107,44,.6)}.btn-accent:hover{background:#f05a1a}
.btn-ghost{background:#fff;border:1.5px solid var(--line)}.btn-ghost:hover{border-color:var(--p);color:var(--p)}
.btn-sm{padding:8px 12px;font-size:13.5px;border-radius:10px}.btn-lg{padding:14px 22px;font-size:16px}
.link{background:none;border:0;color:var(--p);cursor:pointer;font-weight:600}.danger{color:#DC2626!important}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2}.h2{font-size:21px;font-weight:800;letter-spacing:-.01em;margin:30px 0 14px}
.h2row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.h2row a{color:var(--p);font-weight:600}
.logo{display:inline-flex;align-items:center;gap:8px}.logo b{font-size:23px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
/* header */
.hdr{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hdr-in{display:flex;align-items:center;gap:14px;height:70px}
.search{flex:1;display:flex;position:relative}.search input{padding-right:46px;background:var(--bg);border-color:transparent}.search input:focus{background:#fff}
.search button{position:absolute;right:6px;top:6px;bottom:6px;width:36px;border:0;border-radius:9px;background:var(--p);color:#fff;font-size:18px;cursor:pointer}
.hdr-act{display:flex;align-items:center;gap:6px}
.ha{display:flex;flex-direction:column;align-items:center;font-size:19px;padding:4px 10px;border-radius:10px;position:relative;line-height:1.1}.ha small{font-size:11.5px;color:var(--mut);margin-top:3px}.ha:hover{background:var(--bg)}
.ha i,.bnav i{position:absolute;top:0;right:6px;background:var(--a);color:#fff;font-style:normal;font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px}
.lang{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:700;cursor:pointer}.lang span{color:#A0AEC0;font-weight:500}
.main{padding-top:22px;padding-bottom:60px;min-height:70vh}
/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;background:linear-gradient(120deg,#1D4ED8 0%,#2E63F0 55%,#5B8CFF 100%);border-radius:24px;padding:44px;color:#fff;overflow:hidden;position:relative}
.hero:after{content:"";position:absolute;right:-80px;top:-80px;width:360px;height:360px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h1{font-size:42px;line-height:1.08;font-weight:800;letter-spacing:-.03em;margin:14px 0 12px}.hero p{font-size:17px;opacity:.9;max-width:470px;margin-bottom:24px}
.chip{display:inline-block;background:rgba(255,255,255,.16);border-radius:30px;padding:6px 12px;font-size:12.5px;font-weight:600}.chip:first-letter{color:#7CFFB2}
.hero-art{position:relative;min-height:240px}.hero-art>div{position:absolute;background:#fff;border-radius:22px;box-shadow:0 20px 40px -15px rgba(0,0,0,.35);padding:8px}
.ha1{width:170px;left:4%;top:16%;transform:rotate(-6deg)}.ha2{width:190px;right:2%;top:0;z-index:1}.ha3{width:150px;left:40%;bottom:-4%;transform:rotate(5deg);z-index:2}
.benefits{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.benefits>div{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.benefits b{font-size:22px;width:42px;height:42px;display:grid;place-items:center;background:var(--pl);border-radius:12px}.benefits strong{display:block;font-size:14.5px}.benefits span{font-size:12.5px;color:var(--mut)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cats a{position:relative;border-radius:20px;padding:18px;min-height:150px;overflow:hidden;transition:transform .15s}.cats a:hover{transform:translateY(-3px)}
.cats span{font-weight:800;font-size:16.5px;max-width:60%;display:block;position:relative;z-index:1}.cats small{color:var(--mut);position:relative;z-index:1}
.cat-art{position:absolute;right:-8px;bottom:-12px;width:118px}
.promo{display:flex;align-items:center;justify-content:space-between;margin-top:16px;background:#FFF1E8;border:1.5px dashed #FFB38A;border-radius:18px;padding:18px 22px}.promo strong{display:block;font-size:18px}.promo span{color:var(--mut)}
.promo code{background:var(--a);color:#fff;font-weight:800;padding:9px 16px;border-radius:10px;font-size:16px;letter-spacing:.06em}
/* grid & card */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid.g3{grid-template-columns:repeat(3,1fr)}
.pc{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.pc:hover{box-shadow:0 14px 30px -14px rgba(15,23,42,.25);transform:translateY(-2px)}
.pc-img{display:block;aspect-ratio:1/1;padding:14px;position:relative}.pc-img svg,.pp-main svg,.ci-img svg,.thumb svg{width:100%;height:100%;display:block}
.badge-sale{position:absolute;left:10px;top:10px;background:var(--a);color:#fff;font-weight:800;font-size:12px;padding:3px 8px;border-radius:8px}
.badge-few{position:absolute;left:10px;bottom:10px;background:#FEF3C7;color:#92400E;font-weight:700;font-size:11.5px;padding:3px 8px;border-radius:8px}
.fav{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;font-size:17px;color:var(--mut)}.fav.on,.fav2.on{color:#E11D48}
.pc-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc-price{font-size:19px;font-weight:800}.pc-price s,.pp-price s{font-size:13px;color:#94A3B8;font-weight:500;margin-left:4px}
.pc-name{font-size:14px;line-height:1.35;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pc-name:hover{color:var(--p)}
.pc-meta{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px;margin-bottom:4px}.pc-meta.big{font-size:14px;margin:8px 0 14px}.pc-meta a{color:var(--p)}
.stars{position:relative;color:#E2E8F0;letter-spacing:1px;font-size:13px}.stars:before{content:"★★★★★";position:absolute;inset:0;width:var(--r);overflow:hidden;color:#F59E0B}
.pc .btn{margin-top:auto}
/* catalog */
.crumbs{font-size:13px;color:var(--mut);margin-bottom:12px}.crumbs a:hover{color:var(--p)}
.cat-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px}.cat-tabs a{white-space:nowrap;background:#fff;border:1.5px solid var(--line);border-radius:30px;padding:8px 15px;font-weight:600;font-size:14px}.cat-tabs a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cat-layout{display:grid;grid-template-columns:250px 1fr;gap:20px;align-items:start}
.filters{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;position:sticky;top:86px}
.fh{display:flex;justify-content:space-between;margin-bottom:6px}.fl{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:14px 0 6px}
.frow{display:flex;gap:10px;align-items:center}.frow>*{flex:1}.frow.end{justify-content:flex-end}.frow.end>*{flex:0}
.cb{display:flex;align-items:center;gap:9px;padding:5px 0;cursor:pointer;font-size:14.5px}.cb input{width:18px;height:18px;accent-color:var(--p)}.cb.sw{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.toolbar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}.toolbar select{width:auto;margin-left:auto}.mob{display:none}
.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--mut);font-size:18px}.empty.big{padding:70px 20px}.empty.big p{margin:8px 0 22px}.emp-ic{font-size:56px}
/* product */
.pp{display:grid;grid-template-columns:1fr 1fr;gap:32px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px}
.pp-main{border-radius:20px;aspect-ratio:1/1;padding:40px}.pp-thumbs{display:flex;gap:10px;margin-top:12px}.pp-thumbs button{width:76px;height:76px;border-radius:14px;border:2px solid transparent;padding:6px;cursor:pointer}.pp-thumbs button.on{border-color:var(--p)}.pp-thumbs svg{width:100%;height:100%}
.pp-info h1{margin-top:4px}.pp-info h3{margin:22px 0 6px}.pp-info p{color:#334155}
.pp-buy{background:var(--bg);border-radius:18px;padding:18px}.pp-price{font-size:32px;font-weight:800;letter-spacing:-.02em}
.stock{font-weight:700;font-size:14px;margin:6px 0 14px}.stock.ok{color:var(--ok)}.stock.few{color:#D97706}.stock.no{color:#DC2626}
.pp-btns{display:flex;gap:10px}.pp-btns .btn-primary,.pp-btns .btn-ghost:first-child{flex:1}.fav2{font-size:20px;width:56px}
.ship{margin-top:14px;display:grid;gap:8px}.ship div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;background:#fff;border-radius:10px;padding:9px 12px}.ship span{color:var(--mut);text-align:right}
.kaspi-row{margin-top:12px;font-size:13.5px;display:flex;align-items:center;gap:8px}.kq{background:#F14635;color:#fff;font-weight:800;font-size:11px;border-radius:6px;padding:3px 6px;font-style:normal}
.revs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.rev{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.rev div{display:flex;justify-content:space-between;margin-bottom:8px}.rev p{font-size:14px;color:#334155}
/* cart */
.steps{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-weight:600;font-size:14px;color:var(--mut)}.steps em{flex:0 0 40px;height:2px;background:var(--line)}.steps i{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);font-style:normal;margin-right:6px;font-size:12px}.steps .done{color:var(--ink)}.steps .done i{background:var(--p);color:#fff}
.two{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start;margin-top:14px}.two.wide{grid-template-columns:1.5fr 1fr}
.ci{display:grid;grid-template-columns:86px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.ci:last-child{border:0}.ci.sm{grid-template-columns:52px 1fr}
.ci-img{border-radius:14px;padding:8px;aspect-ratio:1/1;display:block}.ci-info{display:flex;flex-direction:column;gap:4px;font-size:14.5px}.ci-sum{font-size:17px}
.qty{display:flex;align-items:center;gap:6px;margin-top:6px}.qty button:not(.link){width:32px;height:32px;border-radius:9px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:17px}.qty span{min-width:24px;text-align:center;font-weight:700}.qty .link{margin-left:10px}
.opts{display:grid;gap:8px;margin-top:10px}.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}.opt.on{border-color:var(--p);background:var(--pl)}
.opt input{width:18px;height:18px;accent-color:var(--p);flex:0 0 18px}.opt span{flex:1;display:flex;flex-direction:column}.opt small{color:var(--mut)}.opt em{font-style:normal;font-weight:700}
.sum{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;position:sticky;top:86px;display:grid;gap:10px}
.srow{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}.srow.green{color:var(--ok)}.srow.total{font-size:20px;padding-top:12px;border-top:1px dashed var(--line);margin-top:4px}
.freebar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}.freebar div{height:100%;background:var(--ok)}
.note{background:var(--pl);color:var(--p2);border-radius:10px;padding:9px 12px;font-size:13.5px;margin-top:10px}
.paybox{max-width:460px;margin:10px auto;text-align:center;display:grid;gap:12px;justify-items:center}.qr{width:220px;height:220px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:16px}.pay-sum{font-size:30px;font-weight:800}
.bank{background:#0F172A;color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;width:100%}.cardf{width:100%;display:grid;gap:10px}
.done-box{max-width:560px;margin:10px auto;text-align:center;display:grid;gap:10px;justify-items:center}.ok-ic{width:70px;height:70px;border-radius:50%;background:#DCFCE7;color:var(--ok);font-size:34px;display:grid;place-items:center}.ok-ic.blue{background:var(--pl)}
.tl{display:grid;gap:0;margin:14px 0;text-align:left;width:100%}.tl div{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:7px 0;position:relative;color:#A0AEC0}
.tl div:not(:last-child):after{content:"";position:absolute;left:8px;top:26px;bottom:-8px;width:2px;background:var(--line)}.tl i{width:18px;height:18px;border-radius:50%;background:var(--line);z-index:1}
.tl .done{color:var(--ink)}.tl .done i{background:var(--p)}.tl .cur i{box-shadow:0 0 0 5px var(--pl)}.tl small{font-size:12.5px;color:var(--mut)}
.st{display:inline-block;color:var(--c);background:color-mix(in srgb,var(--c) 12%,white);font-weight:700;font-size:12.5px;padding:4px 10px;border-radius:20px;white-space:nowrap}
.login{max-width:420px;margin:20px auto;display:grid;gap:8px;justify-items:center;text-align:center}.login form{width:100%;text-align:left}.code-in{font-size:24px;letter-spacing:.5em;text-align:center}
.acc-tabs{display:flex;gap:8px;margin:16px 0}.acc-tabs a{padding:8px 14px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-weight:600}.acc-tabs a.on{background:var(--ink);color:#fff}
.orow{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;margin-bottom:10px;padding:16px 20px}.orow:hover{border-color:var(--p)}
/* footer & bottom nav */
.ftr{background:#0F172A;color:#CBD5E1;padding:36px 0 90px}.ftr-in{display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px}.ftr .logo b{color:#fff}.ftr p{font-size:13.5px;margin-top:10px}
.ftr-links{display:grid;gap:8px;align-content:start}.ftr-pay{display:flex;flex-wrap:wrap;gap:8px;align-content:start}.ftr-pay span{border:1px solid #334155;border-radius:8px;padding:4px 9px;font-size:12px}.ftr-pay p{width:100%}
.bnav{display:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#0F172A;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:100;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
/* admin */
body.is-admin{background:#F1F4F9}
.adm{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.adm-side{background:#0F172A;color:#CBD5E1;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}.adm-side .logo b{color:#fff}.adm-side>small{margin:0 0 14px 4px}
.adm-side nav{display:grid;gap:4px}.adm-side nav a{padding:11px 12px;border-radius:10px;font-weight:600;display:flex;justify-content:space-between}.adm-side nav a.on,.adm-side nav a:hover{background:#1E293B;color:#fff}.adm-side nav i{background:var(--a);color:#fff;font-style:normal;border-radius:10px;padding:0 7px;font-size:12px}
.sync{margin-top:auto;background:#1E293B;border-radius:12px;padding:12px;display:grid;gap:4px;font-size:13px}.sync span{color:#7CFFB2}.sync .btn{margin-top:6px}
.who{display:grid;gap:4px;margin-top:10px;padding:12px 4px 0;border-top:1px solid #1E293B;font-size:13px}.who .link{text-align:left;color:#93C5FD}
.adm-main{padding:26px 30px}
.adm-q{width:260px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.kpis div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}.kpis small{color:var(--mut);font-weight:600}.kpis b{display:block;font-size:24px;font-weight:800;margin-top:2px}.kpis .warn{color:var(--a)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chips button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tbl-wrap{padding:6px;overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{text-align:left;font-size:12px;color:var(--mut);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid #F1F4F9;vertical-align:middle}.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:#F8FAFF}.tbl small{display:block}
.acts{display:flex;gap:6px;flex-wrap:wrap}.tag{background:#F3E8FF;color:#9333EA;border-radius:6px;padding:1px 6px;font-size:12px}
.thumb{display:block;width:46px;height:46px;border-radius:10px;padding:4px}.thumb.s{width:34px;height:34px;flex:0 0 34px}
.stk{font-weight:700}.stk.few{color:#D97706}.stk.no{color:#DC2626}
.ovl{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40}
.drawer{position:fixed;right:0;top:0;bottom:0;width:440px;max-width:94vw;background:#fff;z-index:41;padding:24px;overflow-y:auto;display:grid;gap:12px;align-content:start;animation:slide .25s}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px}.dl span{color:var(--mut)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;width:720px;max-width:94vw;max-height:92vh;overflow:auto}
.mgrid{display:grid;grid-template-columns:200px 1fr;gap:20px;margin:6px 0 18px}.mprev{border-radius:16px;padding:16px;aspect-ratio:1/1}.mprev svg{width:100%}
input[type=color]{height:46px;padding:4px}
.chart{width:100%;margin-top:12px}.top{list-style:none;display:grid;gap:8px;margin-top:12px;counter-reset:t}.top li{display:flex;align-items:center;gap:10px;font-size:13.5px}.top li span:nth-child(2){flex:1}
.adm-login{min-height:100vh;display:grid;place-items:center;padding:20px}.adm-login .box{width:400px;max-width:100%;display:grid;gap:12px;justify-items:center;text-align:center;padding:32px}
/* responsive */
@media (max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.grid.g3{grid-template-columns:repeat(2,1fr)}.benefits{grid-template-columns:repeat(2,1fr)}.cats{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.hero-art{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.two.wide{grid-template-columns:1fr}}
@media (max-width:760px){
 body{font-size:14.5px}.wrap{padding:0 14px}.hdr-in{height:auto;flex-wrap:wrap;padding:10px 14px;gap:10px}.hdr-cat,.hdr-act .ha{display:none}.search{order:3;flex:0 0 100%}.hdr-act{margin-left:auto}
 .hero{padding:26px 22px;border-radius:20px}.hero h1{font-size:30px}.hero p{font-size:15px}.grid,.grid.g3{grid-template-columns:repeat(2,1fr);gap:10px}.pc-body{padding:10px}.pc-price{font-size:16.5px}
 .cat-layout{grid-template-columns:1fr}.filters{display:none;position:static}.filters.open{display:block;margin-bottom:12px}.mob{display:inline-flex}.toolbar select{flex:1}
 .pp{grid-template-columns:1fr;padding:16px;gap:18px}.pp-main{padding:24px}.revs{grid-template-columns:1fr}.two{grid-template-columns:1fr}.sum{position:static}
 .ci{grid-template-columns:70px 1fr}.ci-sum{grid-column:2}.h1{font-size:22px}.orow{grid-template-columns:1fr auto}.orow .st{grid-column:1/-1;justify-self:start}
 .bnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
 .bnav a{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);position:relative;font-weight:600}.bnav a b{font-size:20px;line-height:1.2}.bnav a.on{color:var(--p)}.bnav i{right:22%}
 .ftr-in{grid-template-columns:1fr}.steps em{flex-basis:14px}
 .adm{grid-template-columns:1fr}.adm-side{position:static;height:auto}.adm-main{padding:16px}.adm-q{width:100%}.mgrid{grid-template-columns:1fr}.mprev{width:140px}
}

.pc-img:has(img){padding:0}.pp-main:has(img){padding:0;overflow:hidden}.ci-img:has(img),.thumb:has(img){padding:0;overflow:hidden}
.pp-thumbs button{overflow:hidden}.pp-thumbs button:has(img){padding:0}.pp-main img{transition:transform .35s}
.hero-art>div{overflow:hidden;padding:0;aspect-ratio:1/1}.cat-art{width:112px;height:112px;border-radius:16px;overflow:hidden;right:12px;bottom:12px;box-shadow:0 10px 20px -10px rgba(0,0,0,.35);transform:rotate(4deg)}

function shade(hex, p) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(v + (p > 0 ? (255 - v) * p / 100 : v * p / 100))));
  return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}

function seed() {
  let r = 7; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  const names = ['Айгерім Бекова', 'Данияр Мұратов', 'Ольга Смирнова', 'Нұрлан Әбенов', 'Жанар Серікқызы', 'Арман Тоқтаров', 'Мадина Ахметова', 'Ерлан Қасымов', 'Сәуле Нұрғалиева', 'Тимур Жақыпов', 'Әсел Омарова', 'Бекзат Сейітов'];

  const orders = []; const now = Date.now(); let no = 10231;
  for (let d = 29; d >= 0; d--) {
    const n = d === 0 ? 6 : d === 1 ? 4 : 1 + Math.floor(rnd() * 3);
    for (let k = 0; k < n; k++) {
      const items = []; const m = 1 + Math.floor(rnd() * 3);
      for (let j = 0; j < m; j++) { const p = P[Math.floor(rnd() * P.length)]; if (!items.find(i => i.id === p.id)) items.push({ id: p.id, qty: 1 + Math.floor(rnd() * 2), price: p.price }); }
      const t = now - d * 864e5 - Math.floor(rnd() * 9) * 36e5;
      let st = 'delivered';
      if (d === 0) st = ['new', 'paid', 'paid', 'assembling', 'delivering'][Math.floor(rnd() * 5)];
      else if (d === 1) st = ['assembling', 'delivering', 'delivered'][Math.floor(rnd() * 3)];
      else if (rnd() < .07) st = 'cancelled'; else if (rnd() < .05) st = 'returned';
      const deliv = ['courier', 'courier', 'pickup', 'post'][Math.floor(rnd() * 4)];
      const sum = items.reduce((a, i) => a + i.price * i.qty, 0);
      orders.push({ no: no++, t, items, sum, dcost: dcost(deliv, sum), deliv, pay: (pp => deliv === 'post' && pp === 'cash' ? 'kaspi' : pp)(['kaspi', 'kaspi', 'kaspi', 'card', 'cash'][Math.floor(rnd() * 5)]), status: st, name: names[Math.floor(rnd() * names.length)], phone: '+7 70' + (1 + Math.floor(rnd() * 8)) + ' ' + (100 + Math.floor(rnd() * 899)) + ' ' + (10 + Math.floor(rnd() * 89)) + ' ' + (10 + Math.floor(rnd() * 89)), addr: streets[Math.floor(rnd() * streets.length)], hist: hist(st, t), demo: true });
    }
  }

}

function qr(seedN) { let r = seedN, s = ''; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280; const N = 25, c = 8;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const fin = (a, b) => a < 7 && b < 7; const inF = fin(x, y) || fin(N - 1 - x, y) || fin(x, N - 1 - y);
    let on = inF ? ((x % (N - 7) === 0 || y % (N - 7) === 0 || x % (N - 7) === 6 || y % (N - 7) === 6 || x === N - 1 || y === N - 1) || ((x % (N - 7)) >= 2 && (x % (N - 7)) <= 4 && (y % (N - 7)) >= 2 && (y % (N - 7)) <= 4)) : rnd() > .52;

function render() {

  if (parts[0] !== 'catalog') Q.f = null;
  if (params.cat !== undefined || parts[0] === 'catalog') { if (Q.cat !== params.cat) Q.f = null; Q.cat = params.cat || ''; }
  if (parts[0] !== 'catalog') Q.q = '';
  if (params.q !== undefined) Q.q = params.q;
  document.documentElement.lang = S.lang === 'kz' ? 'kk' : 'ru';
  let html;

    html = ({ catalog: pCatalog, p: () => pProduct(parts[1]), cart: pCart, checkout: pCheckout, pay: () => pPay(parts[1]), done: () => pDone(parts[1]), order: () => pOrder(parts[1]), account: pAccount, fav: pFav }[parts[0]] || pHome)();

const ROLES = { operator: 'Тапсырыс операторы', admin: 'Әкімші (дүкен иесі)' };
function adminRender(tab) {
  if (!S.staff) return `<div class="adm-login"><div class="box">${logo(40)}<h1 class="h1">Қызметкерлер панелі</h1><p class="muted">Рөлді таңдаңыз (демо-кіру)</p>
    <button class="btn btn-primary btn-lg w100" data-role="operator">👩‍💼 Оператор ретінде кіру</button><button class="btn btn-ghost btn-lg w100" data-role="admin">🛠 Әкімші ретінде кіру</button><a href="#/" class="link center">← Дүкенге оралу</a></div></div>`;
  const isAdm = S.staff === 'admin';
  const tabs = [['orders', '📦 Тапсырыстар'], ['products', '🏷 Тауарлар'], ['reports', '📊 Есептер']];
  const newCnt = S.orders.filter(o => ['new', 'paid'].includes(o.status)).length;
  let body;
  if (tab === 'products' || tab === 'reports') body = isAdm ? (tab === 'products' ? aProducts() : aReports()) : `<div class="box empty">🔒 Бұл бөлім тек әкімшіге қолжетімді (рөлдерге бөлу, NFR / FR-14, FR-17)</div>`;
  else body = aOrders();
  return `<div class="adm"><aside class="adm-side">${logo(32)}<small class="muted">Басқару панелі</small>
   <nav>${tabs.map(x => `<a href="#/admin/${x[0]}" class="${tab === x[0] ? 'on' : ''}">${x[1]}${x[0] === 'orders' && newCnt ? `<i>${newCnt}</i>` : ''}</a>`).join('')}</nav>
   <div class="sync"><b>1С синхрондау</b><span>● ${Math.max(1, Math.round((Date.now() - S.sync) / 6e4))} мин бұрын</span><small class="muted">Әр 15 мин сайын (FR-16)</small><button class="btn btn-ghost btn-sm" data-sync>↻ Қазір жаңарту</button></div>
   <div class="who"><b>${ROLES[S.staff]}</b><button class="link" data-out>Шығу</button><a class="link" href="#/">Дүкенге →</a></div></aside>
   <section class="adm-main">${body}</section></div>${A.open ? aDrawer() : ''}${A.edit !== null ? aModal() : ''}`;
}
function aOrders() {
  const all = [...S.orders].sort((a, b) => b.t - a.t);
  const cnt = s => all.filter(o => o.status === s).length;
  const q = A.q.toLowerCase();
  const list = all.filter(o => (A.filter === 'all' || o.status === A.filter) && (!q || (o.no + ' ' + o.name + ' ' + o.phone).toLowerCase().includes(q)));
  const today = all.filter(o => new Date(o.t).toDateString() === new Date().toDateString());
  return `<div class="h2row"><h1 class="h1">Тапсырыстар</h1><input class="adm-q" id="aq" placeholder="№, аты немесе телефон" value="${esc(A.q)}"></div>
  <div class="kpis"><div><small>Бүгін тапсырыс</small><b>${today.length}</b></div><div><small>Өңдеуді күтеді</small><b class="warn">${cnt('new') + cnt('paid')}</b></div><div><small>Жолда</small><b>${cnt('delivering')}</b></div><div><small>Қайтару өтінімі</small><b>${all.filter(o => o.retReq && o.status === 'delivered').length}</b></div></div>
  <div class="chips"><button class="${A.filter === 'all' ? 'on' : ''}" data-af="all">Барлығы ${all.length}</button>${ST.map(s => `<button class="${A.filter === s ? 'on' : ''}" data-af="${s}" style="--c:${STN[s].c}">${STN[s].kz} ${cnt(s)}</button>`).join('')}</div>
  <div class="box tbl-wrap"><table class="tbl"><thead><tr><th>№</th><th>Күні</th><th>Клиент</th><th>Сома</th><th>Жеткізу / төлем</th><th>Мәртебе</th><th>Келесі әрекет</th></tr></thead><tbody>
  ${list.slice(0, 40).map(o => `<tr data-open="${o.no}"><td><b>${o.no}</b>${o.retReq && o.status === 'delivered' ? ' <span class="tag">↺</span>' : ''}</td><td>${dt(o.t)}</td><td>${esc(o.name)}<small class="muted">${esc(o.phone)}</small></td><td><b>${fm(o.sum - (o.disc || 0) + o.dcost)}</b></td><td>${DELIV.find(d => d.id === o.deliv).kz}<small class="muted">${PAYS.find(p => p.id === o.pay).kz}</small></td><td>${badge(o.status)}</td>
   <td class="acts">${NEXT[o.status].map(n => `<button class="btn btn-sm ${n === 'cancelled' || n === 'returned' ? 'btn-ghost' : 'btn-primary'}" data-to="${n}" data-no="${o.no}">${STN[n].kz}</button>`).join('') || '<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table>
  ${list.length > 40 ? `<p class="muted center">Соңғы 40 тапсырыс көрсетілді</p>` : ''}</div>`;
}
function aDrawer() {
  const o = S.orders.find(x => x.no === A.open);
  return `<div class="ovl" data-close></div><aside class="drawer"><div class="h2row"><h2 class="h2">№ ${o.no}</h2><button class="link" data-close>✕</button></div>${badge(o.status)}
   <div class="dl"><span>Клиент</span><b>${esc(o.name)}</b><span>Телефон</span><b>${esc(o.phone)}</b><span>Мекенжай</span><b>${esc(o.addr || '')}</b><span>Жеткізу</span><b>${DELIV.find(d => d.id === o.deliv).kz}</b><span>Төлем</span><b>${PAYS.find(p => p.id === o.pay).kz}</b></div>
   ${o.items.map(i => { const p = prod(i.id); return p ? `<div class="ci sm"><span class="ci-img" style="background:${CATS.find(c => c.id === p.cat).bg}">${pic(p)}</span><div class="ci-info">${esc(p.kz)}<small class="muted">${i.qty} × ${fm(i.price)} · қалдық ${p.stock}</small></div></div>` : ''; }).join('')}
   <div class="srow total"><span>Барлығы</span><b>${fm(o.sum - (o.disc || 0) + o.dcost)}</b></div>
   <h3>Мәртебе тарихы</h3><div class="tl">${o.hist.map(h => `<div class="done"><i style="background:${STN[h.s].c}"></i><b>${STN[h.s].kz}</b><small>${dt(h.t)}</small></div>`).join('')}</div>
   <div class="acts">${NEXT[o.status].map(n => `<button class="btn ${n === 'cancelled' || n === 'returned' ? 'btn-ghost' : 'btn-primary'}" data-to="${n}" data-no="${o.no}">→ ${STN[n].kz}</button>`).join('')}</div>
   <small class="muted">Оператор мәртебені тек күй диаграммасындағы рұқсат етілген бағытта өзгерте алады. Әр өзгерісте клиентке SMS жіберіледі (FR-11).</small></aside>`;
}
function aProducts() {
  const q = A.q.toLowerCase();
  const list = S.products.filter(p => !q || (p.kz + p.brand).toLowerCase().includes(q));
  return `<div class="h2row"><h1 class="h1">Тауарлар <small class="muted">${S.products.length}</small></h1><div class="frow"><input class="adm-q" id="aq" placeholder="Іздеу" value="${esc(A.q)}"><button class="btn btn-accent" data-edit="0">+ Тауар қосу</button></div></div>
  <div class="box tbl-wrap"><table class="tbl"><thead><tr><th></th><th>Атауы</th><th>Санат</th><th>Баға</th><th>Қалдық (1С)</th><th>Сатылды</th><th></th></tr></thead><tbody>
  ${list.map(p => `<tr><td><span class="thumb" style="background:${CATS.find(c => c.id === p.cat).bg}">${pic(p)}</span></td><td><b>${esc(p.kz)}</b><small class="muted">${esc(p.brand)} · ID ${p.id}</small></td><td>${CATS.find(c => c.id === p.cat).kz}</td><td>${fm(p.price)}</td>
   <td><span class="stk ${p.stock === 0 ? 'no' : p.stock <= 5 ? 'few' : ''}">${p.stock} дана</span></td><td>${p.sold}</td><td class="acts"><button class="btn btn-sm btn-ghost" data-edit="${p.id}">✎</button><button class="btn btn-sm btn-ghost danger" data-del="${p.id}">🗑</button></td></tr>`).join('')}</tbody></table></div>`;
}
function aModal() {
  const p = A.edit ? prod(A.edit) : { kz: '', ru: '', brand: '', cat: 'phone', price: '', stock: '', art: 'charger', color: '#2563eb', old: 0 };
  const arts = ['charger', 'cable', 'case', 'powerbank', 'holder', 'glass', 'earbuds', 'headphones', 'watch', 'speaker', 'kettle', 'blender', 'hairdryer', 'iron', 'vacuum', 'scale', 'lamp', 'box', 'towel', 'mug', 'organizer'];
  return `<div class="ovl" data-close></div><form class="modal box" id="pform"><div class="h2row"><h2 class="h2">${A.edit ? 'Тауарды өзгерту' : 'Жаңа тауар'}</h2><button type="button" class="link" data-close>✕</button></div>
   <div class="mgrid"><div class="mprev" id="mprev" style="background:${CATS.find(c => c.id === p.cat).bg}">${pic(p)}</div><div>
   <label class="fl">Атауы (қаз)</label><input name="kz" value="${esc(p.kz)}" required><label class="fl">Атауы (орыс)</label><input name="ru" value="${esc(p.ru)}" required>
   <div class="frow"><div><label class="fl">Бренд</label><input name="brand" value="${esc(p.brand)}" required></div><div><label class="fl">Санат</label><select name="cat">${CATS.map(c => `<option value="${c.id}" ${p.cat === c.id ? 'selected' : ''}>${c.kz}</option>`).join('')}</select></div></div>
   <div class="frow"><div><label class="fl">Баға, ₸</label><input name="price" type="number" min="1" value="${p.price}" required></div><div><label class="fl">Қалдық</label><input name="stock" type="number" min="0" value="${p.stock}" required></div></div>
   <div class="frow"><div><label class="fl">Сурет түрі</label><select name="art" id="mart">${arts.map(a => `<option ${p.art === a ? 'selected' : ''}>${a}</option>`).join('')}</select></div><div><label class="fl">Түсі</label><input name="color" id="mcol" type="color" value="${p.color}"></div></div></div></div>
   <div class="frow end"><button type="button" class="btn btn-ghost" data-close>Болдырмау</button><button class="btn btn-primary">Сақтау</button></div></form>`;
}
function aReports() {
  const ok = S.orders.filter(o => !['cancelled', 'returned', 'new'].includes(o.status));
  const day = 864e5, now = Date.now(), d0 = new Date(); d0.setHours(0, 0, 0, 0);
  const days = [...Array(14)].map((_, i) => { const st = d0.getTime() - (13 - i) * day; const v = ok.filter(o => o.t >= st && o.t < st + day).reduce((a, o) => a + o.sum - (o.disc || 0), 0); return { st, v }; });
  const max = Math.max(...days.map(d => d.v), 1);
  const month = ok.filter(o => now - o.t < 30 * day), todayV = days[13].v;
  const mSum = month.reduce((a, o) => a + o.sum - (o.disc || 0), 0);
  const top = {}; month.forEach(o => o.items.forEach(i => { top[i.id] = (top[i.id] || 0) + i.qty; }));
  const topL = Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const W = 640, H = 220, bw = W / 14;
  return `<div class="h2row"><h1 class="h1">Сатылым есебі</h1><span class="muted">FR-17 · соңғы 30 күн</span></div>
  <div class="kpis"><div><small>Бүгінгі сатылым</small><b>${fm(todayV)}</b></div><div><small>Айлық сатылым</small><b>${fm(mSum)}</b></div><div><small>Орташа чек</small><b>${fm(Math.round(mSum / Math.max(1, month.length)))}</b></div><div><small>Тасталған себеттер</small><b class="warn">${S.abandoned}</b></div></div>
  <div class="two wide"><div class="box"><b>Күндік сатылым, ₸</b><svg viewBox="0 0 ${W} ${H + 30}" class="chart">${days.map((d, i) => { const h = d.v / max * (H - 20); return `<rect x="${i * bw + 6}" y="${H - h}" width="${bw - 12}" height="${h}" rx="5" fill="${i === 13 ? '#FF6B2C' : '#1D4ED8'}" opacity="${i === 13 ? 1 : .85}"><title>${fm(d.v)}</title></rect><text x="${i * bw + bw / 2}" y="${H + 18}" text-anchor="middle" font-size="11" fill="#64748b">${new Date(d.st).getDate()}</text>${d.v ? `<text x="${i * bw + bw / 2}" y="${H - h - 6}" text-anchor="middle" font-size="10" fill="#334155">${Math.round(d.v / 1000)}k</text>` : ''}`; }).join('')}</svg></div>
  <div class="box"><b>Ең көп сатылған 10 тауар</b><ol class="top">${topL.map(([id, q]) => { const p = prod(id); return p ? `<li><span class="thumb s" style="background:${CATS.find(c => c.id === p.cat).bg}">${pic(p)}</span><span>${esc(p.kz)}</span><b>${q} дана</b></li>` : ''; }).join('')}</ol></div></div>`;
}
function adminClick(e) {
  const r = e.target.closest('[data-role]'); if (r) { S.staff = r.dataset.role; save(); go('#/admin/orders'); return; }
  if (e.target.closest('[data-out]')) { S.staff = null; save(); render(); return; }
  if (e.target.closest('[data-sync]')) { S.sync = Date.now(); save(); toast('1С: қалдықтар жаңартылды'); rerender(); return; }
  const af = e.target.closest('[data-af]'); if (af) { A.filter = af.dataset.af; rerender(); return; }
  const to = e.target.closest('[data-to]'); if (to) { e.stopPropagation(); const o = S.orders.find(x => x.no === +to.dataset.no); setStatus(o, to.dataset.to); if (to.dataset.to === 'returned') o.retReq = false; toast(`№ ${o.no}: ${STN[to.dataset.to].kz} · клиентке SMS жіберілді`); rerender(); return; }
  if (e.target.closest('[data-close]')) { A.open = null; A.edit = null; rerender(); return; }
  const op = e.target.closest('[data-open]'); if (op) { A.open = +op.dataset.open; rerender(); return; }
  const ed = e.target.closest('[data-edit]'); if (ed) { A.edit = +ed.dataset.edit; rerender(); return; }
  const dl = e.target.closest('[data-del]'); if (dl) { const p = prod(dl.dataset.del); if (confirmDel(p)) { S.products = S.products.filter(x => x !== p); S.cart = S.cart.filter(i => i.id !== p.id); save(); toast('Тауар каталогтан жойылды'); rerender(); } return; }
}
let delArm = null;
function confirmDel(p) { if (delArm === p.id) { delArm = null; return true; } delArm = p.id; toast('Жою үшін 🗑 тағы бір рет басыңыз'); setTimeout(() => { if (delArm === p.id) delArm = null; }, 3000); return false; }
function adminChange(e) {
  if (e.target.id === 'mart' || e.target.id === 'mcol' || e.target.name === 'cat') { const f = $('#pform'); $('#mprev').innerHTML = ART(f.art.value, f.color.value); $('#mprev').style.background = CATS.find(c => c.id === f.cat.value).bg; }
}
document.addEventListener('input', e => { if (e.target.id === 'aq') { A.q = e.target.value; clearTimeout(A.tm); A.tm = setTimeout(() => { const pos = e.target.selectionStart; rerender(); const n = $('#aq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); } if (e.target.id === 'mcol') adminChange(e); });
function adminSubmit(e) {
  if (e.target.id !== 'pform') return; const f = e.target;
  const v = { kz: f.kz.value.trim(), ru: f.ru.value.trim(), brand: f.brand.value.trim(), cat: f.cat.value, price: +f.price.value, stock: +f.stock.value, art: f.art.value, color: f.color.value };
  if (A.edit) { Object.assign(prod(A.edit), v); toast('Тауар сақталды'); }
  else { const id = Math.max(...S.products.map(p => p.id)) + 1; S.products.push({ id, old: 0, rating: 5, reviews: 0, sold: 0, ...v }); toast('Тауар сәтті қосылды'); }
  A.edit = null; save(); rerender();
}
</script></body></html>
